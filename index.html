<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Monitor de Vazão</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

.card{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
    width:350px;
}

h1{
    margin-bottom:30px;
}

.value{
    font-size:48px;
    font-weight:bold;
    color:#2c7be5;
}

.unit{
    font-size:20px;
    color:#666;
}

.total{
    margin-top:20px;
    font-size:18px;
}

.status{
    margin-top:15px;
    font-size:14px;
    color:#888;
}

</style>

</head>

<body>

<div class="card">

<h1>💧 Vazão de Água</h1>

<div class="value" id="flow">--</div>
<div class="unit">L/min</div>

<div class="total">
Total: <span id="total">--</span> L
</div>

<div class="status" id="status">
Aguardando dados...
</div>

</div>

<script>

async function atualizar(){

    try{

        const response = await fetch("/vazao");
        const data = await response.json();

        document.getElementById("flow").innerText = data.flow.toFixed(2);
        document.getElementById("total").innerText = data.total.toFixed(3);

        document.getElementById("status").innerText =
        "Atualizado: " + new Date().toLocaleTimeString();

    }catch(e){

        document.getElementById("status").innerText =
        "Erro ao conectar ao servidor";

    }

}

setInterval(atualizar,1000);

</script>

</body>
</html>
